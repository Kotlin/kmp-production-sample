#Gradle
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.caching=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# properties for manual testing
#kotlin_version=2.3.0-dev-4694
#kotlin_repo_url=https://packages.jetbrains.team/maven/p/kt/experimental
#kotlin_language_version=2.3
#kotlin_api_version=2.3

# Limits the number of Native link tasks running in parallel, to prevent OOMs and similar issues.
# Available since 2.5.20.
kotlin.native.linkMaxWorkers=2
